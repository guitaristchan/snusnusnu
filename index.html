<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>총장 선거 캠페인 시뮬레이터</title>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

    :root {
      --body-bg: #fdfcfc;
      --ff-sans: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ff-mono: 'Google Sans Code', monospace;
      
      --surface-bright: #ffffff;
      --surface-dim: #f2f0f0;
      --surface-container-high: #e6e6e6;
      --on-surface: #000000;
      --on-surface-variant: rgba(0, 0, 0, 0.6);
      
      --primary: #3186ff;
      --accent-fixed: #3186ff;
      --accent-container: #dcf1ff;
      --stroke-default: #e3e3e3;
      
      --positive: #008052;
      --positive-container: #daf9d4;
      --error: #de2d29;
      --error-container: #ffdeec;

      --chart-1: #2575fc;
      --chart-2: #5b6e9e;
      --chart-3: #228a49;
      --chart-4: #62991b;
      --chart-5: #1e564d;
      --chart-8: #997112;

      --r-s: 8px;
      --r-m: 12px;
      --r-l: 16px;
      --r-full: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: var(--body-bg);
      font-family: var(--ff-sans);
      color: var(--on-surface);
    }

    .widget-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .campaign-card {
      background: var(--surface-bright);
      border-radius: var(--r-l);
      border: 1px solid var(--stroke-default);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .campaign-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stepper-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-top: 8px;
    }

    .step-node {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .step-badge {
      width: 28px;
      height: 28px;
      border-radius: var(--r-full);
      background: var(--surface-dim);
      color: var(--on-surface-variant);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .step-node.active .step-badge {
      background: var(--accent-fixed);
      color: #ffffff;
    }

      background: var(--accent-container);
