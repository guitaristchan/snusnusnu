/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */
  --on-surface: var(--lumi-sys-color--on-surface, #000000);
  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

  --primary-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);
  --accent-fixed: var(--lumi-sys-color--accent-fixed, #3186ff);
  /* status */
  --positive: var(--lumi-sys-color--positive, #008052);
  --positive-container: var(--lumi-sys-color--positive-container, #daf9d4);
  --error: var(--lumi-sys-color--error, #de2d29);

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);
  min-height: 36px;
  padding: 6px 16px;
  font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif);
  font-size: 13px;
  font-weight: 500;
  line-height: 18px;
  color: var(--on-surface, #000000);
  background-color: var(--surface-bright, #ffffff);
  border: 1px solid var(--stroke-default, #e3e3e3);
  border-radius: var(--lumi-sys-shape--full, 999px);
  cursor: pointer;
  user-select: none;
  box-sizing: border-box;
  transition: background-color 0.15s, color 0.15s, border-color 0.15s;
}
button:hover {
  background-color: var(--surface-container-high, #e6e6e6);
}
button.active, button.is-active, button.selected, button.is-selected, button[aria-pressed="true"], button[aria-selected="true"] {
  background-color: var(--accent-container, #dcf1ff);
  color: var(--accent-fixed, #3186ff);
  border-color: transparent;
}

.lumi-btn, [class^="lumi-btn-"], [class*=" lumi-btn-"] { display: inline-flex; align-items: center; justify-content: center; gap: var(--lumi-sys-spacing--s, 8px); min-height: 40px; padding: 0px 20px; font-family: var(--ff-sans, 'Google Sans Flex', 'Google Sans', sans-serif); font-size: 14px; font-weight: 500; line-height: 20px; border-radius: var(--lumi-sys-shape--full, 999px); border: 1px solid var(--lumi-sys-color--stroke-default, #e3e3e3); cursor: pointer; user-select: none; transition: background-color 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s, transform 0.1s; text-decoration: none; box-sizing: border-box; white-space: nowrap; }
.lumi-btn:active, .lumi-btn.is-pressed, [class^="lumi-btn-"]:active, [class*=" lumi-btn-"]:active { transform: scale(0.98); }
.lumi-btn--tonal, .lumi-btn-tonal, .lumi-btn--secondary, .lumi-btn-secondary, [class^="lumi-btn-"], [class*=" lumi-btn-"] { background-color: var(--lumi-sys-color--surface-bright, #ffffff); color: var(--lumi-sys-color--on-surface-default, #000000); }

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

  <script>
    // INITIAL STATE & CONFIG
    const STEP_NAMES = [
      '캠프 구성',
      '정책 조립',
      '순회 유세',
      '연합 간담회',
      '투표 컷오프',
      '스캔들 대응',
      '이사회 면접'
    ];

    const initialState = {
      currentStep: 1,
      budget: 50,
      stress: 0,
      approval: {
        hum: 30,      // weight 20%
        eng: 30,      // weight 35%
        med: 30,      // weight 21%
        staff: 30,    // weight 14%
        students: 30, // weight 10%
        board: 30     // requirement >= 50%
      },
      selections: {},
      isGameOver: false,
      gameResult: null // 'win', 'fail_cutoff', 'fail_board', 'fail_budget'
    };

    let state = JSON.parse(JSON.stringify(initialState));

    function calculateWeightedVote(app) {
      const score = (app.hum * 0.20) + (app.eng * 0.35) + (app.med * 0.21) + (app.staff * 0.14) + (app.students * 0.10);
      return Math.round(score * 10) / 10;
    }

    function clamp(val, min = 0, max = 100) {
      return Math.max(min, Math.min(max, val));
    }

    function renderStepper() {
      const nav = document.getElementById('stepper-nav-bar');
      if (nav) nav.innerHTML = STEP_NAMES.map((name, idx) => {
        const stepNum = idx + 1;
        let activeClass = '';
        if (stepNum === state.currentStep) activeClass = 'active';
        else if (stepNum < state.currentStep) activeClass = 'completed';
        
        return `
          <div class="step-node ${activeClass}">
            <div class="step-badge">${stepNum}</div>
            <div class="step-label">${name}</div>
          </div>
        `;
      }).join('');
      
      document.getElementById('step-counter-tag').textContent = `STEP ${state.currentStep} / 7`;
    }

    function renderMetrics() {
      // Numbers
      document.getElementById('val-budget').textContent = state.budget;
      document.getElementById('val-stress').textContent = `${state.stress} / 100`;
      
      document.getElementById('val-hum').textContent = `${Math.round(state.approval.hum)}%`;
      document.getElementById('val-eng').textContent = `${Math.round(state.approval.eng)}%`;
      document.getElementById('val-med').textContent = `${Math.round(state.approval.med)}%`;
      document.getElementById('val-staff').textContent = `${Math.round(state.approval.staff)}%`;
      document.getElementById('val-students').textContent = `${Math.round(state.approval.students)}%`;
      document.getElementById('val-board').textContent = `${Math.round(state.approval.board)}%`;

      // Bars
      document.getElementById('bar-budget').style.width = `${clamp(state.budget)}%`;
      document.getElementById('bar-stress').style.width = `${clamp(state.stress)}%`;

      document.getElementById('bar-hum').style.width = `${clamp(state.approval.hum)}%`;
      document.getElementById('bar-eng').style.width = `${clamp(state.approval.eng)}%`;
      document.getElementById('bar-med').style.width = `${clamp(state.approval.med)}%`;
      document.getElementById('bar-staff').style.width = `${clamp(state.approval.staff)}%`;
      document.getElementById('bar-students').style.width = `${clamp(state.approval.students)}%`;
      document.getElementById('bar-board').style.width = `${clamp(state.approval.board)}%`;

      // Weighted Score
      const weighted = calculateWeightedVote(state.approval);
      const weightedEl = document.getElementById('val-weighted');
      if (weightedEl) weightedEl.textContent = `${weighted}%`;
      if (weighted < 26) {
        weightedEl.style.color = getCssVar('--error');
      } else {
        weightedEl.style.color = getCssVar('--accent-fixed');
      }
    }

    function selectOption(step, optionId, effect) {
      if (state.isGameOver) return;
      state.selections[step] = { optionId, effect };
      document.getElementById('btn-next').disabled = false;
      renderStepContent();
    }

    function toggleKeyword(keywordId, effect) {
      if (state.isGameOver) return;
      if (!state.selections[2]) state.selections[2] = { keywords: [] };
      
      const keywords = state.selections[2].keywords;
      const idx = keywords.findIndex(k => k.id === keywordId);
      
      if (idx > -1) {
        keywords.splice(idx, 1);
      } else {
        if (keywords.length < 2) {
          keywords.push({ id: keywordId, effect });
        }
      }
      
      document.getElementById('btn-next').disabled = (keywords.length === 0);
      renderStepContent();
    }

    function renderStepContent() {
      const titleEl = document.getElementById('step-title');
      const descEl = document.getElementById('step-desc');
      const container = document.getElementById('choices-container');
      const nextBtn = document.getElementById('btn-next');

      if (container) container.innerHTML = '';

      if (state.isGameOver) {
        renderGameOverScreen();
        return;
      }

      switch (state.currentStep) {
        case 1:
          titleEl.textContent = '1단계: 러닝메이트(부총장) 획득';
          if (descEl) descEl.textContent = '캠페인을 이끌 러닝메이트 파트너 교수를 선임하세요. 선택한 파벌의 지지도가 상승하지만 타 학문군과의 비대칭이 발생합니다.';
          
          const step1Opts = [
            { id: 'eng', name: '이공계 부총장 (AI·첨단연구중심)', desc: '이공 지지도 +20%, 인문 -10%, 예산 -5', effect: { eng: 20, hum: -10, budget: -5 } },
            { id: 'hum', name: '인문계 부총장 (융합·공공가치중심)', desc: '인문 지지도 +20%, 이공 -10%, 예산 -5', effect: { hum: 20, eng: -10, budget: -5 } },
            { id: 'med', name: '의약학계 부총장 (바이오·병원중심)', desc: '의약학 지지도 +20%, 직원 -5%, 학생 -5%, 예산 -10', effect: { med: 20, staff: -5, students: -5, budget: -10 } }
          ];

          step1Opts.forEach(opt => {
            const isSel = state.selections[1]?.optionId === opt.id;
            const card = document.createElement('div');
            card.className = `choice-card ${isSel ? 'selected' : ''}`;
            card.onclick = () => selectOption(1, opt.id, opt.effect);
            if (card) card.innerHTML = `
              <div style="font-weight: 600;" class="lumi-body-m">${opt.name}</div>
              <div class="lumi-body-s" style="color: var(--on-surface-variant);">${opt.desc}</div>
            `;
            container.appendChild(card);
          });
          break;

        case 2:
          titleEl.textContent = '2단계: 주요 핵심 공약 조립';
          if (descEl) descEl.textContent = '핵심 핵심키워드 공약을 1~2개 조합하십시오. 공약 선택에 따라 예산 손실과 이사회/구성원 지지도가 교차합니다.';
          
          const keywords = [
            { id: 'res', name: '연구비 300억 확충', desc: '이공 +15%, 이사회 +10%, 예산 -15, 스트레스 +5', effect: { eng: 15, board: 10, budget: -15, stress: 5 } },
            { id: 'tuition', name: '등록금 동결 및 학생 복지', desc: '학생 +25%, 이사회 -10%, 예산 -10', effect: { students: 25, board: -10, budget: -10 } },
            { id: 'staff_welfare', name: '직원 인력 확충 및 임금 인상', desc: '직원 +20%, 인문 +10%, 예산 -10', effect: { staff: 20, hum: 10, budget: -10 } },
            { id: 'hospital', name: '의료원 독립성 강화', desc: '의약학 +20%, 이사회 -5%, 스트레스 -5', effect: { med: 20, board: -5, stress: -5 } }
          ];

          const selectedKw = state.selections[2]?.keywords || [];
          const chipGroup = document.createElement('div');
          chipGroup.className = 'keyword-chip-group';

          keywords.forEach(kw => {
            const isSel = selectedKw.some(k => k.id === kw.id);
            const card = document.createElement('div');
            card.className = `choice-card ${isSel ? 'selected' : ''}`;
            card.style.flex = '1 1 calc(50% - 10px)';
            card.onclick = () => toggleKeyword(kw.id, kw.effect);
            if (card) card.innerHTML = `
              <div style="font-weight: 600; display:flex; justify-content:space-between;" class="lumi-body-m">
                ${kw.name} ${isSel ? '<span style="color:var(--accent-fixed)">[선택됨]</span>' : ''}
              </div>
              <div class="lumi-body-s" style="color: var(--on-surface-variant);">${kw.desc}</div>
            `;
            chipGroup.appendChild(card);
          });
          container.appendChild(chipGroup);
          break;

        case 3:
          titleEl.textContent = '3단계: 단과대학 순회 유세 현안';
          if (descEl) descEl.textContent = '의과대학 분쟁 및 대학 중앙집권화 요구가 첨예하게 대립하고 있습니다. 정책 노선을 결정하십시오.';
          
          const step3Opts = [
            { id: 'autonomy', name: '의대 및 부속병원 자율권 최대 보장', desc: '의약학 지지도 +25%, 이사회 신임 -10%, 스트레스 -5', effect: { med: 25, board: -10, stress: -5 } },
            { id: 'central', name: '본부 중앙 집권화 및 예산 통제', desc: '이사회 신임 +15%, 의약학 지지도 -20%, 스트레스 +10', effect: { board: 15, med: -20, stress: 10 } }
          ];

          step3Opts.forEach(opt => {
            const isSel = state.selections[3]?.optionId === opt.id;
            const card = document.createElement('div');
            card.className = `choice-card ${isSel ? 'selected' : ''}`;
            card.onclick = () => selectOption(3, opt.id, opt.effect);
            if (card) card.innerHTML = `
              <div style="font-weight: 600;" class="lumi-body-m">${opt.name}</div>
              <div class="lumi-body-s" style="color: var(--on-surface-variant);">${opt.desc}</div>
            `;
            container.appendChild(card);
          });
          break;

        case 4:
          titleEl.textContent = '4단계: 학내 구성원 연합 간담회';
          if (descEl) descEl.textContent = '직원 노조와 총학생회가 공동 요구안을 제출했습니다. 예산 소요 대책을 마련해야 합니다.';
          
          const step4Opts = [
            { id: 'full', name: '전폭 수용 (시설 개선 및 성과급 지급)', desc: '직원 +20%, 학생 +20%, 예산 -20', effect: { staff: 20, students: 20, budget: -20 } },
            { id: 'compromise', name: '절충안 제시 (단계적 이행)', desc: '직원 +10%, 학생 +10%, 예산 -5', effect: { staff: 10, students: 10, budget: -5 } },
            { id: 'freeze', name: '예산 동결 및 긴축 재정 선언', desc: '직원 -10%, 학생 -10%, 이사회 +10%, 예산 +10', effect: { staff: -10, students: -10, board: 10, budget: 10 } }
          ];

          step4Opts.forEach(opt => {
            const isSel = state.selections[4]?.optionId === opt.id;
            const card = document.createElement('div');
            card.className = `choice-card ${isSel ? 'selected' : ''}`;
            card.onclick = () => selectOption(4, opt.id, opt.effect);
            if (card) card.innerHTML = `
              <div style="font-weight: 600;" class="lumi-body-m">${opt.name}</div>
              <div class="lumi-body-s" style="color: var(--on-surface-variant);">${opt.desc}</div>
            `;
            container.appendChild(card);
          });
          break;

        case 5:
          titleEl.textContent = '5단계: 구성원 투표 및 컷오프 산정';
          if (descEl) descEl.textContent = '1차 전체 구성원 투표 결과를 개표합니다. 가중 득표율 26% 미만 시 즉시 탈락 처리됩니다.';
          
          const weightedScore = calculateWeightedVote(state.approval);
          const passed = weightedScore >= 26;

          const summaryCard = document.createElement('div');
          summaryCard.style.padding = '16px';
          summaryCard.style.borderRadius = 'var(--r-m)';
          summaryCard.style.background = passed ? 'var(--positive-container)' : 'var(--error-container)';
          summaryCard.style.color = passed ? 'var(--positive)' : 'var(--error)';
          summaryCard.style.textAlign = 'center';
          if (summaryCard) summaryCard.innerHTML = `
            <div class="lumi-headline-s" style="font-weight:700;">1차 개표 최종 가중 득표율: ${weightedScore}%</div>
            <p class="lumi-body-m" style="margin: 8px 0 0 0;">
              ${passed ? '선거 기준선(26.0%)을 통과하였습니다! 결선 검증 및 이사회 면접 단계로 진출합니다.' : '득표율 미달(26.0% 미만)로 결선 진출에 실패하였습니다. 캠페인이 종료됩니다.'}
            </p>
          `;
          container.appendChild(summaryCard);

          if (!passed) {
            state.isGameOver = true;
            state.gameResult = 'fail_cutoff';
            nextBtn.style.display = 'none';
          } else {
            nextBtn.disabled = false;
            if (nextBtn) nextBtn.textContent = '6단계 진출';
          }
          break;

        case 6:
          titleEl.textContent = '6단계: 캠페인 위기 대응 (돌발 스캔들)';
          if (descEl) descEl.textContent = '상대 캠프에서 논문 검증 및 과거 예산 집행 내역 방만 의혹을 제기했습니다. 위기 관리 방안을 선택하세요.';
          
          const step6Opts = [
            { id: 'hard', name: '정면 반박 및 강력 법적 대응', desc: '이사회 신임 +10%, 교수/학업 지지도 -10%, 스트레스 +15', effect: { board: 10, hum: -10, eng: -10, med: -10, stress: 15 } },
            { id: 'apology', name: '유감 표명 및 외부 검증 수용', desc: '학내 지지도 +5%, 이사회 신임 -15%, 스트레스 -10', effect: { hum: 5, eng: 5, med: 5, board: -15, stress: -10 } },
            { id: 'recompense', name: '쇄신용 자체 예산 투입안 즉시 발표', desc: '예산 -15, 직원 +10%, 학생 +10%', effect: { budget: -15, staff: 10, students: 10 } }
          ];

          step6Opts.forEach(opt => {
            const isSel = state.selections[6]?.optionId === opt.id;
            const card = document.createElement('div');
            card.className = `choice-card ${isSel ? 'selected' : ''}`;
            card.onclick = () => selectOption(6, opt.id, opt.effect);
            if (card) card.innerHTML = `
              <div style="font-weight: 600;" class="lumi-body-m">${opt.name}</div>
              <div class="lumi-body-s" style="color: var(--on-surface-variant);">${opt.desc}</div>
            `;
            container.appendChild(card);
          });
          break;

        case 7:
          titleEl.textContent = '7단계: 재단 이사회 최종 면접';
          if (descEl) descEl.textContent = '최종 임명을 위해 이사회 심의를 거칩니다. (승인 조건: 이사회 신임도 50% 이상 & 예산 잔액 >= 0)';
          
          const winBoard = state.approval.board >= 50;
          const winBudget = state.budget >= 0;
          const winAll = winBoard && winBudget;

          const resultCard = document.createElement('div');
          resultCard.style.padding = '16px';
          resultCard.style.borderRadius = 'var(--r-m)';
          resultCard.style.background = winAll ? 'var(--accent-container)' : 'var(--error-container)';
          resultCard.style.border = `1px solid ${winAll ? 'var(--accent-fixed)' : 'var(--error)'}`;
          resultCard.style.textAlign = 'center';
          
          if (resultCard) resultCard.innerHTML = `
            <div class="lumi-headline-m" style="font-weight:700; color: ${winAll ? 'var(--accent-fixed)' : 'var(--error)'};">
              ${winAll ? '제22대 신임 총장 당선!' : '이사회 임명 부결 (낙선)'}
            </div>
            <div class="lumi-body-m" style="margin-top: 8px;">
              ${winAll ? '축하합니다! 균형 잡힌 공약과 이사회 설득을 통해 총장으로 최종 임명되었습니다.' : '이사회 승인 조건(신임도 50% 이상 및 예산 건전성)을 충족하지 못했습니다.'}
            </div>
            <div class="lumi-code" style="margin-top: 12px; font-size: 13px; text-align: left; background: var(--surface-dim); padding: 8px; border-radius: 6px;">
              • 이사회 최종 신임도: ${Math.round(state.approval.board)}% (목표: 50% 이상 ${winBoard ? '달성' : '미달'})<br>
              • 잔여 선거 예산: ${state.budget} (목표: 0 이상 ${winBudget ? '달성' : '적자'})<br>
              • 최종 가중 지지도: ${calculateWeightedVote(state.approval)}%
            </div>
          `;
          container.appendChild(resultCard);

          state.isGameOver = true;
          state.gameResult = winAll ? 'win' : (!winBoard ? 'fail_board' : 'fail_budget');
          nextBtn.style.display = 'none';
          break;
      }
    }

    function renderGameOverScreen() {
      // Handled inside case 5 & 7 inline summaries
    }

    function applyEffects(effect) {
      if (!effect) return;
      if (effect.budget !== undefined) state.budget += effect.budget;
      if (effect.stress !== undefined) state.stress = clamp(state.stress + effect.stress);
      
      if (effect.hum !== undefined) state.approval.hum = clamp(state.approval.hum + effect.hum);
      if (effect.eng !== undefined) state.approval.eng = clamp(state.approval.eng + effect.eng);
      if (effect.med !== undefined) state.approval.med = clamp(state.approval.med + effect.med);
      if (effect.staff !== undefined) state.approval.staff = clamp(state.approval.staff + effect.staff);
      if (effect.students !== undefined) state.approval.students = clamp(state.approval.students + effect.students);
      if (effect.board !== undefined) state.approval.board = clamp(state.approval.board + effect.board);
    }

    function nextStep() {
      if (state.isGameOver) return;

      // Apply step choices
      if (state.currentStep === 2) {
        const kws = state.selections[2]?.keywords || [];
        kws.forEach(k => applyEffects(k.effect));
      } else {
        const sel = state.selections[state.currentStep];
        if (sel && sel.effect) {
          applyEffects(sel.effect);
        }
      }

      state.currentStep++;
      
      const nextBtn = document.getElementById('btn-next');
      nextBtn.disabled = true;

      renderMetrics();
      renderStepper();
      renderStepContent();
    }

    function resetCampaign() {
      state = JSON.parse(JSON.stringify(initialState));
      const nextBtn = document.getElementById('btn-next');
      nextBtn.style.display = 'inline-flex';
      nextBtn.disabled = true;
      if (nextBtn) nextBtn.textContent = '다음 단계 진행';

      renderMetrics();
      renderStepper();
      renderStepContent();
    }

    function init() {
      renderMetrics();
      renderStepper();
      renderStepContent();
    }

    init();
  </script>

  <script>
    const applyTheme = t => { 
      document.documentElement.setAttribute('data-theme', t); 
      if (typeof renderMetrics === 'function') renderMetrics(); 
    };
    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) applyTheme('dark');
    window.addEventListener('message', e => { 
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme); 
    });
    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
